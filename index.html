<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Babylon.js + 3Dconnexion SpaceMouse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #panel { position: absolute; top: 12px; left: 12px; width: 360px; max-height: 90vh; overflow: auto; background: rgba(255,255,255,.92); padding: 12px; border-radius: 8px; font-size: 13px; }
    button { margin: 4px 4px 4px 0; }
    pre { white-space: pre-wrap; max-height: 220px; overflow: auto; background: #eee; padding: 8px; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <!-- Place 3dconnexion.min.js in ./vendor/. It is not redistributed by this repository. -->
  <script src="./vendor/3dconnexion.min.js"></script>
  <script src="./js/babylon-3dconnexion-fly-controller.js"></script>
</head>
<body>
  <canvas id="renderCanvas" tabindex="1"></canvas>
  <div id="panel">
    <strong>Babylon.js + 3Dconnexion SpaceMouse</strong>
    <div id="status">initializing</div>
    <div id="counters"></div>
    <button id="resetBtn">Reset camera</button>
    <button id="downloadBtn">Download log</button>
    <pre id="log"></pre>
  </div>

  <script>
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    // The controller is designed for a right-handed Babylon scene.
    // This matches the convention used by the 3Dconnexion web/Three.js sample
    // more closely than Babylon's default left-handed coordinate system.
    scene.useRightHandedSystem = true;
    scene.clearColor = new BABYLON.Color4(0.88, 0.91, 0.95, 1);

    const camera = new BABYLON.UniversalCamera('camera', new BABYLON.Vector3(0, 2, -10), scene);
    camera.rotationQuaternion = BABYLON.Quaternion.Identity();
    camera.speed = 0.25;

    new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
    BABYLON.MeshBuilder.CreateGround('ground', { width: 40, height: 40 }, scene);

    for (let z = -15; z <= 15; z += 5) {
      for (let x = -15; x <= 15; x += 5) {
        const box = BABYLON.MeshBuilder.CreateBox('box', { size: 1 }, scene);
        box.position.set(x, 0.5, z);
      }
    }

    const statusEl = document.getElementById('status');
    const countersEl = document.getElementById('counters');
    const logEl = document.getElementById('log');

    const controller = new Babylon3DconnexionFlyController({
      canvas,
      camera,
      scene,
      maxTranslationStep: 0.08,
      onStatus(message, counters) {
        statusEl.textContent = message;
        countersEl.textContent = JSON.stringify(counters);
      },
      onLog(entry, counters) {
        countersEl.textContent = JSON.stringify(counters);
        const compact = `${entry.type} ${JSON.stringify(entry.payload).slice(0, 180)}`;
        logEl.textContent = compact + '\n' + logEl.textContent.split('\n').slice(0, 10).join('\n');
      },
    });

    document.getElementById('resetBtn').onclick = () => controller.reset();
    document.getElementById('downloadBtn').onclick = () => controller.downloadLog();

    controller.connect();

    engine.runRenderLoop(() => scene.render());
    window.addEventListener('resize', () => engine.resize());
    canvas.addEventListener('click', () => canvas.focus());
  </script>
</body>
</html>
